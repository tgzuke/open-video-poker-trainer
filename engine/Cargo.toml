[package]
name = "ovp-engine"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Exact-EV video poker engine for Open Video Poker Trainer (no UI dependencies)."
publish = false

[lib]
name = "ovp_engine"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "ovp"
path = "src/bin/ovp.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# The verification suite does heavy enumeration; optimise test builds but keep
# overflow checks and debug assertions on.
[profile.test]
opt-level = 3

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
